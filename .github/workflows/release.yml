name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      # latest.json is shared by all platforms; serialize uploads to preserve every entry.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Validate release version and signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure the TAURI_SIGNING_PRIVATE_KEY repository secret first.' }
          $appVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($appVersion -ne $packageVersion -or $appVersion -ne $cargoVersion) { throw 'Versions in package.json, Cargo.toml and tauri.conf.json must match.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$appVersion") { throw 'The release tag must match the application version.' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p repovela-core
      - name: Build signed bundles and draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Repovela v__VERSION__
          releaseBody: '下載 Windows 安裝程式或 macOS 通用版 DMG（Apple Silicon／Intel），或在 Repovela 偏好設定中檢查更新。macOS 使用 ad-hoc 簽署，尚未經 Apple 公證，首次開啟可能需要在「系統設定 → 隱私權與安全性」允許。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Verify macOS universal bundle and code signature
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Repovela.app"
          lipo "$app/Contents/MacOS/repovela" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
      - name: Upload Windows portable archive
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $archive = "Repovela_${version}_windows-x64-portable.zip"
          Compress-Archive -Path src-tauri/target/release/repovela.exe -DestinationPath $archive -Force
          gh release upload "v$version" $archive --clobber
