[package]
name = "repovela"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]
members = ["core"]
resolver = "2"

[lib]
name = "repovela_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
repovela-core = { path = "core" }
portable-pty = "0.9"
font-kit = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
