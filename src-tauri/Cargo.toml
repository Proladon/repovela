[package]
name = "repovela"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]
members = ["core"]
resolver = "2"

[lib]
name = "repovela_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
repovela-core = { path = "core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
